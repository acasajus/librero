# Librero Service Daemon Configuration File

[auth]
# Z-Library Account Credentials
email = "your_zlibrary_email@example.com"
password = "your_zlibrary_password"

# Optional Session Tokens (auto-generated on successful login)
# remix_userid = ""
# remix_userkey = ""

[telegram]
# Telegram Bot API Token from @BotFather
bot_token = "123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ"

# List of authorized Telegram users and their recipient email addresses
[[telegram.allowed_users]]
user_id = 123456789             # Your Telegram numerical User ID
username = "myuser"             # Optional reference username
email = "mykindle@kindle.com"   # Email address where books will be sent via SMTP

[smtp]
# SMTP Server Configuration (Brevo, Gmail App Password, or custom SMTP provider)
host = "smtp.gmail.com"
port = 587
username = "your_smtp_username@example.com"
password = "your_smtp_password"
from_email = "your_sender_email@example.com"

[storage]
# Local directory to store downloaded books (subdirectories created per user ID)
download_dir = "./downloads"

# Local SQLite / Turso Database Path
turso_db_path = "librero.db"

[tor]
# Connection Mode: "embedded" (default: pure Rust Arti Tor, no local Tor service needed!), "socks5", or "auto"
mode = "embedded"
proxy_url = "socks5h://127.0.0.1:9050"
onion_address = "http://loginzlib2vrak5zzpcocc3ouizykn6k5qecgj2tzlnab5wcbqhembyd.onion"

fallback_onion_addresses = [
    "http://bookszlibb74ugqojhzhg2a63w5i2atv5bqarulgczawnbmsb6s6qead.onion"
]

connect_timeout_seconds = 45
